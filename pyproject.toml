[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorytwin"
version = "0.1.0"
description = "Episodic memory for AI coding assistants: captures the reasoning behind technical decisions and serves it back via RAG and MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jesús Jiménez Pérez", email = "jesusjp2333@gmail.com"}
]
maintainers = [
    {name = "Jesús Jiménez Pérez", email = "jesusjp2333@gmail.com"}
]
keywords = ["ai", "llm", "memory", "rag", "mcp", "embeddings", "copilot", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

dependencies = [
    # Core
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",  # For OpenRouter and other compatible providers
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "mcp>=1.19,<2",  # 2.x replaced the low-level Server decorator API
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.0.0",
    "sqlalchemy>=2.0.0",
    "scikit-learn>=1.0.0",  # For DBSCAN clustering in consolidation
]

[project.optional-dependencies]
# Web interface (Oráculo UI)
ui = [
    "gradio>=4.0.0",
]

# Observability (Langfuse SDK with the observation API)
observability = [
    "langfuse>=3.4,<5",
]

# All optional features
all = [
    "memorytwin[ui,observability]",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/JesusJimenez01/memorytwin"
Repository = "https://github.com/JesusJimenez01/memorytwin"
Issues = "https://github.com/JesusJimenez01/memorytwin/issues"

[project.scripts]
mt = "memorytwin.escriba.cli:main"
memorytwin = "memorytwin.escriba.cli:main"
memorytwin-oraculo = "memorytwin.oraculo.app:main"
memorytwin-mcp = "memorytwin.mcp_server.server:main"

[tool.setuptools.package-data]
memorytwin = ["templates/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/memorytwin/observability.py" = ["E402"]
"src/memorytwin/mcp_server/server.py" = ["E402"]
"src/memorytwin/escriba/cli.py" = ["E402", "E501"]

[tool.coverage.run]
source = ["src/memorytwin"]
omit = [
    # Interactive entry points (Gradio UI, terminal chat)
    "src/memorytwin/oraculo/app.py",
    "src/memorytwin/oraculo/oraculo.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 70
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
